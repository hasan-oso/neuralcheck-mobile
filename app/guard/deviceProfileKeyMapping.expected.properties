# Hand-maintained since 2026-10-09 (user decision 5: "the R8 names a..f in deviceProfiles are
# the first step in fixing the device key") - NOT a snapshot of R8 letters any more.
# Each line: <DeviceProfileKey field, as written in DeviceFingerprint.kt>=<the name R8 must leave it
# with>. The release must emit the SOURCE names (primary, layerA_keystore, ... layerE_sensorSig), so
# every field is listed against itself. DeviceProfileKey's fields carry @SerializedName(<own name>)
# and app/proguard-rules.pro keeps annotated fields (-keepclassmembers ... @SerializedName <fields>),
# so R8 leaves them alone; a field R8 kept has NO line in mapping.txt, which the guard reads as
# "kept under its own name" (checkDeviceProfileKeyMapping in app/build.gradle.kts;
# tools/guards/check_device_profile_key_mapping.py is the standalone twin).
# History: until 2026-10-09 this file froze R8's letters (primary=a ... layerE_sensorSig=f), taken
# from the 2026-06-09 and 2026-09-20 release mappings (the 2026-10-07 mapping of 62507f4 agrees),
# because the server's findDeviceProfile reads `deviceProfileKey.a`. Do not "regenerate" this file
# from a mapping.txt: that would write back whatever R8 did. app/src/test/.../DeviceProfileKey*
# tests check that this list equals DeviceProfileKey's declared fields.
# class = net.neuralcheck.util.DeviceProfileKey
primary=primary
layerA_keystore=layerA_keystore
layerB_firebaseId=layerB_firebaseId
layerC_androidId=layerC_androidId
layerD_buildSig=layerD_buildSig
layerE_sensorSig=layerE_sensorSig
